name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should happen? Include alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope notes
      description: Does it affect permissions, network calls, docs or existing users?
    validations:
      required: false
